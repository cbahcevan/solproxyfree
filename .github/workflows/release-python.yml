# Publishes to PyPI on every push to main that changes python/, but only when
# __version__ in python/solproxy/__init__.py is not on PyPI yet. To release:
# bump the version and push. Pushes that keep the version publish nothing.
#
# Uses PyPI trusted publishing: no token in GitHub secrets. Set it up once at
# pypi.org -> Your account -> Publishing -> add a pending publisher:
# owner cbahcevan, repo solproxyfree, workflow release-python.yml,
# environment pypi.
name: release-python

on:
  push:
    branches: [main]
    paths: ["python/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        working-directory: python
        run: |
          v=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('solproxy/__init__.py').read())[1])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/solproxy/$v/json")
          if [ "$code" = "200" ]; then
            echo "solproxy $v is already on PyPI, nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - working-directory: python
        run: |
          pip install -e ".[dev]"
          ruff check . && ruff format --check . && python -m mypy solproxy && pytest -q
          python -m build && twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
      - name: Tag the release
        run: |
          git tag "py-v${{ needs.check.outputs.version }}"
          git push origin "py-v${{ needs.check.outputs.version }}"
